name: Radar de Memecoins

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Simular, enviar una prueba o publicar alertas reales'
        type: choice
        options:
          - dry-run
          - test
          - live
        default: dry-run

permissions:
  contents: write

concurrency:
  group: memecoin-radar
  cancel-in-progress: false

jobs:
  radar:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Leer la última versión de la rama predeterminada
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Configurar autor de los commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Instalar dependencias verificadas
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Ejecutar el radar
        env:
          RUN_MODE: ${{ inputs.mode || 'live' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ENABLE_BASE: ${{ vars.ENABLE_BASE }}
          CHANNEL_USERNAME: ${{ vars.CHANNEL_USERNAME }}
          RADAR_BRANCH_REF: ${{ github.ref }}
        run: python radar.py --mode "$RUN_MODE"
